name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux x86_64 GCC 13
                      os: ubuntu-24.04
                      cc: gcc-13
                      cxx: g++-13

                    - name: Linux x86_64 Clang 18
                      os: ubuntu-24.04
                      cc: clang-18
                      cxx: clang++-18

                    - name: Linux ARM64 GCC 13
                      os: ubuntu-24.04-arm
                      cc: gcc-13
                      cxx: g++-13

                    - name: Linux ARM64 Clang 18
                      os: ubuntu-24.04-arm
                      cc: clang-18
                      cxx: clang++-18

                    - name: macOS ARM64 Apple Clang
                      os: macos-14
                      cc: clang
                      cxx: clang++

                    - name: Windows MSVC
                      os: windows-2022
                      cc: cl
                      cxx: cl

        steps:
            - uses: actions/checkout@v6

            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y ninja-build

            - name: Install dependencies (macOS)
              if: runner.os == 'macOS'
              run: brew install ninja

            - name: Configure (Unix)
              if: runner.os != 'Windows'
              env:
                  CC: ${{ matrix.cc }}
              run: |
                  mkdir build && cd build
                  cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

            - name: Configure (Windows)
              if: runner.os == 'Windows'
              run: |
                  mkdir build
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release

            - name: Test
              working-directory: build
              run: ctest --output-on-failure -C Release

            - name: Upload build artifacts
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v7
              with:
                  name: libhotkv-${{ matrix.name }}
                  path: |
                      build/lib*
                      build/Release/lib*
                  retention-days: 7

    # Build options that the matrix above does not cover: shared libraries, TLS
    # on and off, and the sanitizers. No HotKV server is available on the runner,
    # so the live suites report "Skipped"; the unit and wire tests run.
    options:
        name: Linux GCC 13 ${{ matrix.linkage }} TLS=${{ matrix.tls }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                linkage: [static, shared]
                tls: ["OFF", "ON"]
        steps:
            - uses: actions/checkout@v6

            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

            - name: Configure
              env:
                  CC: gcc-13
              run: |
                  shared=OFF; [ "${{ matrix.linkage }}" = shared ] && shared=ON
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release                     -DBUILD_SHARED_LIBS=$shared -DHOTKV_USE_SSL=${{ matrix.tls }}

            - name: Build
              run: cmake --build build

            - name: Test
              run: ctest --test-dir build --output-on-failure

    sanitizers:
        name: ASan + UBSan
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

            - name: Configure
              env:
                  CC: gcc-13
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHOTKV_USE_SSL=ON                     -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"                     -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

            - name: Build
              run: cmake --build build

            - name: Test
              run: ctest --test-dir build --output-on-failure
